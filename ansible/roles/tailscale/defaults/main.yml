# Auth key for non-interactive login. Provide via .env.yml or vault.
tailscale_auth_key: ""

# Optional: custom login server (for Tailscale Enterprise/Headscale)
tailscale_login_server: ""

# Hostname override for device in Tailscale
tailscale_hostname: ""

# Behavior toggles
tailscale_accept_dns: true
tailscale_accept_routes: false
tailscale_advertise_exit_node: false
tailscale_advertise_routes: []
tailscale_use_exit_node: ""
tailscale_enable_ssh: false
tailscale_extra_args: []
