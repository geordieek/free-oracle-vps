- name: Copy config file
  copy:
    src: 'nginx.conf'
    dest: '/etc/nginx/nginx.conf'
    mode: 0644

- name: Copy hardened defaults
  copy:
    src: 'harden.conf'
    dest: '/etc/nginx/conf.d/harden.conf'
    mode: 0644

- name: Generate Cloudflare IP allowlist when exposing code-server to public
  when: expose_code_server_public | default(false)
  block:
    - name: Fetch Cloudflare IPv4 ranges
      uri:
        url: https://www.cloudflare.com/ips-v4
        return_content: yes
      register: cf_ipv4

    - name: Fetch Cloudflare IPv6 ranges
      uri:
        url: https://www.cloudflare.com/ips-v6
        return_content: yes
      register: cf_ipv6

    - name: Render NGINX include for Cloudflare IPs
      copy:
        dest: /etc/nginx/conf.d/cloudflare-ips.conf
        mode: 0644
        content: |
          # Generated by Ansible - Cloudflare networks
          # Trust real client IP from Cloudflare
          real_ip_header CF-Connecting-IP;
          {% for cidr in (cf_ipv4.content.split('\n') + cf_ipv6.content.split('\n')) if cidr.strip() != '' %}
          set_real_ip_from {{ cidr }};
          allow {{ cidr }};
          {% endfor %}

- name: Ensure HTTP port is available
  shell:
    cmd: |
      set +o pipefail
      sudo lsof -ti:{{ item }} | xargs -r sudo kill
    executable: /bin/bash
  with_items:
    - '{{ ports.http }}'
    - '{{ ports.https }}'
  changed_when: true

- name: Enable and restart nginx
  service:
    name: nginx
    enabled: true
    state: restarted
